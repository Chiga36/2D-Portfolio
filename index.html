<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chirag's Portfolio</title>
    <style>
      @font-face {
        font-family: monogram;
        src: url(monogram.ttf);
      }

      @font-face {
        font-family: "Ghostero";
        src: url(/fonts/Ghostero-Demo-Lettersweet.otf) format("opentype");
      }

      body {
        font-family: monogram, monospace;
        font-size: 2rem;
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #3a1f5c;
        background-image: url("/wall-pattern.png");
        background-repeat: repeat;
        background-size: 96px 96px;
        image-rendering: pixelated;
        transition: background-color 0.8s ease;
      }

      #app.room-a {
        background-color: #3a1f5c;
      }

      #app.room-b {
        background-color: #1f5c4a;
      }

      #app.room-c {
        background-color: #6b3a1f;
      }

      #app.intro-active {
        background-image: none;
        background-color: #3a1f5c;
      }

      #textbox {
        position: absolute;
        left: 10%;
        right: 10%;
        bottom: 2vh;
        min-height: 10vh;
        background: #fdecc8;
        border-radius: 18px;
        border: 6px solid #8a5a2a;
        box-shadow:
          inset 0 0 0 3px #e8c877,
          0 0.4rem 0 rgba(0, 0, 0, 0.2);
        padding: 1.5rem 3.5rem 1.5rem 1.75rem;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: flex-start;
        word-spacing: 0.2rem;
      }

      .corner-ornament {
        position: absolute;
        width: 3px;
        height: 3px;
        background: #8a5a2a;
        box-shadow:
          -3px 3px 0 #8a5a2a,
          0 3px 0 #8a5a2a,
          3px 3px 0 #8a5a2a,
          -6px 6px 0 #8a5a2a,
          -3px 6px 0 #8a5a2a,
          0 6px 0 #8a5a2a,
          3px 6px 0 #8a5a2a,
          6px 6px 0 #8a5a2a,
          -3px 9px 0 #8a5a2a,
          0 9px 0 #8a5a2a,
          3px 9px 0 #8a5a2a,
          0 12px 0 #8a5a2a;
      }

      .corner-ornament.tl {
        top: 10px;
        left: 10px;
      }

      .corner-ornament.tr {
        top: 10px;
        right: 10px;
        transform: scaleX(-1);
      }

      .corner-ornament.bl {
        bottom: 10px;
        left: 10px;
        transform: scaleY(-1);
      }

      .corner-ornament.br {
        bottom: 10px;
        right: 10px;
        transform: scale(-1, -1);
      }

      .ui-text {
        margin: 0;
        font-size: 2.3rem;
        user-select: none;
      }

      .ui-close-btn {
        font-family: monogram, monospace;
        width: 2.75rem;
        height: 2.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #6b4423;
        border-radius: 8px;
        background: #e8c877;
        color: #6b4423;
        font-size: 1.5rem;
        font-weight: bold;
        padding: 0;
        cursor: pointer;
      }

      .btn-container {
        position: absolute;
        right: 1.25rem;
        bottom: 1.25rem;
      }

      #explore-status {
        position: absolute;
        top: 1.25rem;
        left: 1.25rem;
        z-index: 5;
        user-select: none;
      }

      #explore-toggle {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0;
        background: #fdecc8;
        border: 3px solid #8a5a2a;
        border-radius: 10px;
        padding: 0.5rem 1rem;
        font-family: monogram, monospace;
        font-size: 1.4rem;
        color: #4a2f1a;
        cursor: pointer;
      }

      #explore-arrow {
        font-size: 1.1rem;
        transition: transform 0.2s ease;
      }

      #explore-status.open #explore-arrow {
        transform: rotate(180deg);
      }

      #explore-list {
        display: none;
        list-style: none;
        margin: 0.4rem 0 0;
        padding: 0.5rem 0.75rem;
        background: #fdecc8;
        border: 3px solid #8a5a2a;
        border-radius: 10px;
        max-height: 42vh;
        min-width: 15rem;
        overflow-y: auto;
        font-size: 1.2rem;
        color: #4a2f1a;
      }

      #explore-status.open #explore-list {
        display: block;
      }

      #explore-list li {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.2rem 0;
        white-space: nowrap;
      }

      #explore-list .explore-check {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.3rem;
        height: 1.3rem;
        flex-shrink: 0;
        border: 2px solid #8a5a2a;
        border-radius: 4px;
        background: #fff8e8;
        font-size: 1rem;
        line-height: 1;
      }

      #explore-list li.done .explore-check {
        background: #8a5a2a;
        color: #fdecc8;
      }

      #explore-list li.done .explore-label {
        text-decoration: line-through;
        opacity: 0.6;
      }

      #music-toggle {
        position: absolute;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 11;
        font-family: monogram, monospace;
        width: 3rem;
        height: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #6b4423;
        border-radius: 8px;
        background: #e8c877;
        color: #6b4423;
        font-size: 1.5rem;
        padding: 0;
        cursor: pointer;
      }

      #interact-hint {
        position: absolute;
        left: 50%;
        bottom: 2rem;
        transform: translateX(-50%);
        z-index: 6;
        margin: 0;
        display: none;
        background: #fdecc8;
        border: 3px solid #8a5a2a;
        border-radius: 10px;
        padding: 0.5rem 1.1rem;
        font-family: monogram, monospace;
        font-size: 1.4rem;
        color: #4a2f1a;
        user-select: none;
        animation: interact-hint-pulse 1s ease-in-out infinite;
      }

      @keyframes interact-hint-pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      #outro-screen {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #3fa843;
        background-image: url("/outro-bg.png");
        background-size: cover;
        background-position: center;
      }

      .outro-dot {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      #outro-title {
        position: absolute;
        top: 6%;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-family: monogram, monospace;
        font-size: 2.2rem;
        color: #ffcf4d;
        text-shadow:
          2px 2px 0 #5a3a10,
          -2px 2px 0 #5a3a10,
          2px -2px 0 #5a3a10,
          -2px -2px 0 #5a3a10;
        user-select: none;
      }

      #outro-note {
        position: absolute;
        z-index: 1;
        left: 24%;
        top: 20%;
        width: 52%;
        height: 58%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4%;
        box-sizing: border-box;
      }

      #outro-note-text {
        font-family: "Ghostero", monogram, cursive;
        font-weight: normal;
        font-size: 3rem;
        line-height: 1.5;
        color: #1a1005;
        margin: 0;
        white-space: pre-line;
        text-align: left;
      }

      #outro-zombie,
      #outro-peashooter {
        position: absolute;
        bottom: 3vh;
        height: 38vh;
        width: auto;
        z-index: 1;
        filter: drop-shadow(0 0.5rem 0.4rem rgba(0, 0, 0, 0.35));
      }

      #outro-zombie {
        right: 4%;
      }

      #outro-peashooter {
        left: 4%;
      }

      #outro-close {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 2;
        font-family: monogram, monospace;
        font-size: 1.3rem;
        border: 3px solid #6b4423;
        border-radius: 8px;
        background: #e8c877;
        color: #6b4423;
        padding: 0.5rem 1.25rem;
        cursor: pointer;
      }

      #library-screen {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(20, 10, 30, 0.88);
      }

      #library-title {
        position: absolute;
        top: 2.5%;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-family: monogram, monospace;
        font-size: 1.7rem;
        color: #fdecc8;
        text-align: center;
        user-select: none;
      }

      #library-image-wrap {
        position: relative;
        width: min(32rem, 62%);
        aspect-ratio: 474 / 471;
        margin-top: 3rem;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.6);
      }

      #library-image-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .library-column {
        position: absolute;
        top: 0;
        height: 100%;
        width: 33.3334%;
      }

      .library-col-0 {
        left: 0;
      }

      .library-col-1 {
        left: 33.3334%;
      }

      .library-col-2 {
        left: 66.6668%;
      }

      .library-genre {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
        background: #fdecc8;
        border: 2px solid #8a5a2a;
        border-radius: 6px;
        padding: 0.2rem 0.4rem;
        font-family: monogram, monospace;
        font-size: 0.8rem;
        line-height: 1.15;
        color: #4a2f1a;
        text-align: center;
        max-width: 92%;
        box-sizing: border-box;
        pointer-events: none;
      }

      .library-row {
        position: absolute;
        left: 0;
        width: 100%;
        height: 16.6667%;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .library-row:hover {
        background-color: rgba(255, 221, 110, 0.3);
      }

      .library-row-tooltip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        box-sizing: border-box;
      }

      .library-row-tooltip span {
        background: #fdecc8;
        border: 3px solid #8a5a2a;
        border-radius: 8px;
        padding: 0.3rem 0.6rem;
        font-family: monogram, monospace;
        font-size: 0.85rem;
        line-height: 1.2;
        color: #4a2f1a;
        text-align: center;
        opacity: 0;
        transform: scale(0.9);
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
        pointer-events: none;
      }

      .library-row:hover .library-row-tooltip span {
        opacity: 1;
        transform: scale(1);
      }

      #library-close {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 2;
        font-family: monogram, monospace;
        font-size: 1.3rem;
        border: 3px solid #6b4423;
        border-radius: 8px;
        background: #e8c877;
        color: #6b4423;
        padding: 0.5rem 1.25rem;
        cursor: pointer;
      }

      #skip-intro {
        position: absolute;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 10;
        font-family: monogram, monospace;
        font-size: 1.3rem;
        display: none;
        align-items: center;
        border: 3px solid #6b4423;
        border-radius: 8px;
        background: #e8c877;
        color: #6b4423;
        padding: 0.5rem 1.25rem;
        cursor: pointer;
      }

      #welcome-screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
      }

      #welcome-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          to bottom,
          #241454 0%,
          #241454 10%,
          #3c1f7a 10%,
          #3c1f7a 20%,
          #6a2f9e 20%,
          #6a2f9e 30%,
          #9c3f9e 30%,
          #9c3f9e 40%,
          #d14f8a 40%,
          #d14f8a 50%,
          #ee6a6a 50%,
          #ee6a6a 58%,
          #f4934f 58%,
          #f4934f 68%,
          #f8b86a 68%,
          #f8b86a 78%,
          #fbd98f 78%,
          #fbd98f 88%,
          #fdf0c8 88%,
          #fdf0c8 100%
        );
      }

      #welcome-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.5) 1px,
          transparent 1.5px
        );
        background-size: 4px 4px;
        mix-blend-mode: overlay;
        opacity: 0.5;
      }

      .stars {
        position: absolute;
        inset: 0;
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow:
          2vw 5vh 0 0 #fff,
          10vw 12vh 0 0 #fff,
          18vw 4vh 0 0 #fff,
          27vw 10vh 0 0 #fff,
          36vw 6vh 0 0 #fff,
          44vw 15vh 0 0 #fff,
          53vw 8vh 0 0 #fff,
          61vw 13vh 0 0 #fff,
          69vw 5vh 0 0 #fff,
          77vw 11vh 0 0 #fff,
          85vw 7vh 0 0 #fff,
          93vw 14vh 0 0 #fff,
          6vw 22vh 0 0 #fff,
          97vw 25vh 0 0 #fff,
          4vw 38vh 0 0 #fff,
          14vw 45vh 0 0 #fff,
          23vw 33vh 0 0 #fff,
          33vw 48vh 0 0 #fff,
          50vw 40vh 0 0 #fff,
          58vw 35vh 0 0 #fff,
          67vw 50vh 0 0 #fff,
          75vw 42vh 0 0 #fff,
          83vw 36vh 0 0 #fff,
          91vw 48vh 0 0 #fff,
          11vw 53vh 0 0 #fff,
          46vw 52vh 0 0 #fff,
          8vw 65vh 0 0 #fff,
          20vw 72vh 0 0 #fff,
          35vw 60vh 0 0 #fff,
          55vw 68vh 0 0 #fff,
          63vw 78vh 0 0 #fff,
          72vw 62vh 0 0 #fff,
          80vw 75vh 0 0 #fff,
          90vw 66vh 0 0 #fff;
        animation: twinkle 2.4s ease-in-out infinite alternate;
      }

      @keyframes twinkle {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 1;
        }
      }

      .sparkle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #fff;
        box-shadow:
          0 -4px 0 #fff,
          0 4px 0 #fff,
          -4px 0 0 #fff,
          4px 0 0 #fff;
        animation: twinkle 1.8s ease-in-out infinite alternate;
      }

      .cloud {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #fff;
        box-shadow:
          4px 0 0 #fff,
          8px 0 0 #fff,
          12px 0 0 #fff,
          -8px 4px 0 #fff,
          -4px 4px 0 #fff,
          0 4px 0 #fff,
          4px 4px 0 #fff,
          8px 4px 0 #fff,
          12px 4px 0 #fff,
          16px 4px 0 #fff,
          20px 4px 0 #fff,
          -8px 8px 0 #dcecfb,
          -4px 8px 0 #dcecfb,
          0 8px 0 #dcecfb,
          4px 8px 0 #dcecfb,
          8px 8px 0 #dcecfb,
          12px 8px 0 #dcecfb,
          16px 8px 0 #dcecfb,
          20px 8px 0 #dcecfb;
      }

      .moon {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #fff;
        box-shadow:
          6px 0 0 #fff,
          12px 0 0 #fff,
          -6px 6px 0 #fff,
          0 6px 0 #fff,
          6px 6px 0 #fff,
          12px 6px 0 #fff,
          18px 6px 0 #fff,
          24px 6px 0 #fff,
          -12px 12px 0 #fff,
          -6px 12px 0 #fff,
          0 12px 0 #fff,
          6px 12px 0 #fff,
          12px 12px 0 #fff,
          18px 12px 0 #e4d9f2,
          24px 12px 0 #fff,
          30px 12px 0 #fff,
          -12px 18px 0 #fff,
          -6px 18px 0 #fff,
          0 18px 0 #fff,
          6px 18px 0 #fff,
          12px 18px 0 #e4d9f2,
          18px 18px 0 #fff,
          24px 18px 0 #fff,
          30px 18px 0 #fff,
          -12px 24px 0 #fff,
          -6px 24px 0 #fff,
          0 24px 0 #fff,
          6px 24px 0 #fff,
          12px 24px 0 #fff,
          18px 24px 0 #fff,
          24px 24px 0 #e4d9f2,
          30px 24px 0 #fff,
          -12px 30px 0 #fff,
          -6px 30px 0 #fff,
          0 30px 0 #e4d9f2,
          6px 30px 0 #fff,
          12px 30px 0 #fff,
          18px 30px 0 #fff,
          24px 30px 0 #fff,
          30px 30px 0 #fff,
          -6px 36px 0 #fff,
          0 36px 0 #fff,
          6px 36px 0 #fff,
          12px 36px 0 #fff,
          18px 36px 0 #fff,
          24px 36px 0 #fff,
          0 42px 0 #fff,
          6px 42px 0 #fff,
          12px 42px 0 #fff,
          18px 42px 0 #fff;
      }

      #welcome-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      #welcome-title {
        margin: 0;
        font-family: monogram, monospace;
        font-weight: bold;
        font-size: 7.5rem;
        letter-spacing: 0.3rem;
        color: #ebe1f7;
        text-shadow:
          1px 1px 0 #2d1b4d,
          2px 2px 0 #2d1b4d,
          3px 3px 0 #2d1b4d,
          4px 4px 0 #2d1b4d,
          5px 5px 0 #2d1b4d,
          6px 6px 0 #2d1b4d,
          7px 7px 0 #2d1b4d,
          8px 8px 0 #2d1b4d,
          9px 9px 0 #2d1b4d,
          10px 10px 0 #1f1438;
        user-select: none;
      }

      #welcome-controls {
        margin: 0;
        font-family: monogram, monospace;
        font-size: 2.2rem;
        color: #fff;
        text-shadow: 2px 2px 0 #2d1b4d;
        user-select: none;
      }

      #welcome-subtitle {
        margin: 0;
        font-family: monogram, monospace;
        font-size: 2.2rem;
        color: #fff;
        text-shadow: 2px 2px 0 #2d1b4d;
        animation: blink 1.2s steps(2, start) infinite;
        user-select: none;
      }

      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="room-a intro-active">
      <div>
        <div id="textbox-container" style="display: none">
          <div id="textbox">
            <span class="corner-ornament tl"></span>
            <span class="corner-ornament tr"></span>
            <span class="corner-ornament bl"></span>
            <span class="corner-ornament br"></span>
            <p id="dialogue" class="ui-text"></p>
            <div class="btn-container">
              <button id="close" class="ui-close-btn" aria-label="Close">&rarr;</button>
            </div>
          </div>
        </div>
      </div>
      <canvas id="game"></canvas>
      <div id="explore-status" style="display: none">
        <button id="explore-toggle" aria-expanded="false">
          <span id="explore-text">You have explored 0% about me</span>
          <span id="explore-arrow">&#9662;</span>
        </button>
        <ul id="explore-list"></ul>
      </div>
      <p id="interact-hint">Press Enter to interact</p>
      <div id="outro-screen">
        <div class="outro-dot" style="left: 8%; bottom: 6%; background: #e05a3f"></div>
        <div class="outro-dot" style="left: 14%; bottom: 10%; background: #f4d14d"></div>
        <div class="outro-dot" style="right: 10%; bottom: 7%; background: #f4d14d"></div>
        <h2 id="outro-title">You found a note:</h2>
        <div id="outro-note">
          <p id="outro-note-text">Thank you for exploring my home!

Feel free to reach out:
LinkedIn: chiragsaha3
Email: chigaswami@gmail.com</p>
        </div>
        <img id="outro-zombie" src="/zombie.png" alt="Zombie" />
        <img id="outro-peashooter" src="/peashooter.png" alt="Peashooter" />
        <button id="outro-close" aria-label="Close">&times; Close</button>
      </div>
      <div id="library-screen">
        <h2 id="library-title">Currently reading — hover a shelf row</h2>
        <div id="library-image-wrap">
          <img src="/library-shelf.jpg" alt="Bookshelf" />
          <div class="library-column library-col-0">
            <span class="library-genre" id="library-genre-0"></span>
          </div>
          <div class="library-column library-col-1">
            <span class="library-genre" id="library-genre-1"></span>
          </div>
          <div class="library-column library-col-2">
            <span class="library-genre" id="library-genre-2"></span>
          </div>
        </div>
        <button id="library-close" aria-label="Close">&times; Close</button>
      </div>
      <audio id="bgm" src="/bgm.mp3" loop preload="auto"></audio>
      <button id="music-toggle" aria-label="Toggle music" aria-pressed="true">🔊</button>
      <button id="skip-intro" aria-label="Skip introduction">Skip (Esc) &rarr;</button>
      <div id="welcome-screen">
        <div id="welcome-bg">
          <div class="stars"></div>
