<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chirag's Portfolio</title>
    <style>
      @font-face {
        font-family: monogram;
        src: url(monogram.ttf);
      }

      body {
        font-family: monogram, monospace;
        font-size: 2rem;
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #3a1f5c;
        background-image: url("/wall-pattern.png");
        background-repeat: repeat;
        background-size: 96px 96px;
        image-rendering: pixelated;
        transition: background-color 0.8s ease;
      }

      #app.room-a {
        background-color: #3a1f5c;
      }

      #app.room-b {
        background-color: #1f5c4a;
      }

      #app.room-c {
        background-color: #6b3a1f;
      }

      #app.intro-active {
        background-image: none;
        background-color: #3a1f5c;
      }

      #textbox {
        position: absolute;
        left: 10%;
        right: 10%;
        bottom: 2vh;
        min-height: 10vh;
        background: #fdecc8;
        border-radius: 18px;
        border: 6px solid #8a5a2a;
        box-shadow:
          inset 0 0 0 3px #e8c877,
          0 0.4rem 0 rgba(0, 0, 0, 0.2);
        padding: 1.5rem 3.5rem 1.5rem 1.75rem;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: flex-start;
        word-spacing: 0.2rem;
      }

      .corner-ornament {
        position: absolute;
        width: 3px;
        height: 3px;
        background: #8a5a2a;
        box-shadow:
          -3px 3px 0 #8a5a2a,
          0 3px 0 #8a5a2a,
          3px 3px 0 #8a5a2a,
          -6px 6px 0 #8a5a2a,
          -3px 6px 0 #8a5a2a,
          0 6px 0 #8a5a2a,
          3px 6px 0 #8a5a2a,
          6px 6px 0 #8a5a2a,
          -3px 9px 0 #8a5a2a,
          0 9px 0 #8a5a2a,
          3px 9px 0 #8a5a2a,
          0 12px 0 #8a5a2a;
      }

      .corner-ornament.tl {
        top: 10px;
        left: 10px;
      }

      .corner-ornament.tr {
        top: 10px;
        right: 10px;
        transform: scaleX(-1);
      }

      .corner-ornament.bl {
        bottom: 10px;
        left: 10px;
        transform: scaleY(-1);
      }

      .corner-ornament.br {
        bottom: 10px;
        right: 10px;
        transform: scale(-1, -1);
      }

      .ui-text {
        margin: 0;
        font-size: 2.3rem;
        user-select: none;
      }

      .ui-close-btn {
        font-family: monogram, monospace;
        width: 2.75rem;
        height: 2.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #6b4423;
        border-radius: 8px;
        background: #e8c877;
        color: #6b4423;
        font-size: 1.5rem;
        font-weight: bold;
        padding: 0;
        cursor: pointer;
      }

      .btn-container {
        position: absolute;
        right: 1.25rem;
        bottom: 1.25rem;
      }

      #explore-status {
        position: absolute;
        top: 1.25rem;
        left: 1.25rem;
        z-index: 5;
        margin: 0;
        background: #fdecc8;
        border: 3px solid #8a5a2a;
        border-radius: 10px;
        padding: 0.5rem 1rem;
        font-size: 1.4rem;
        color: #4a2f1a;
        user-select: none;
      }

      #music-toggle {
        position: absolute;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 11;
        font-family: monogram, monospace;
        width: 3rem;
        height: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #6b4423;
        border-radius: 8px;
        background: #e8c877;
        color: #6b4423;
        font-size: 1.5rem;
        padding: 0;
        cursor: pointer;
      }

      #skip-intro {
        position: absolute;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 10;
        font-family: monogram, monospace;
        font-size: 1.3rem;
        display: none;
        align-items: center;
        border: 3px solid #6b4423;
        border-radius: 8px;
        background: #e8c877;
        color: #6b4423;
        padding: 0.5rem 1.25rem;
        cursor: pointer;
      }

      #welcome-screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
      }

      #welcome-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          to bottom,
          #241454 0%,
          #241454 10%,
          #3c1f7a 10%,
          #3c1f7a 20%,
          #6a2f9e 20%,
          #6a2f9e 30%,
          #9c3f9e 30%,
          #9c3f9e 40%,
          #d14f8a 40%,
          #d14f8a 50%,
          #ee6a6a 50%,
          #ee6a6a 58%,
          #f4934f 58%,
          #f4934f 68%,
          #f8b86a 68%,
          #f8b86a 78%,
          #fbd98f 78%,
          #fbd98f 88%,
          #fdf0c8 88%,
          #fdf0c8 100%
        );
      }

      #welcome-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.5) 1px,
          transparent 1.5px
        );
        background-size: 4px 4px;
        mix-blend-mode: overlay;
        opacity: 0.5;
      }

      .stars {
        position: absolute;
        inset: 0;
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow:
          2vw 5vh 0 0 #fff,
          10vw 12vh 0 0 #fff,
          18vw 4vh 0 0 #fff,
          27vw 10vh 0 0 #fff,
          36vw 6vh 0 0 #fff,
          44vw 15vh 0 0 #fff,
          53vw 8vh 0 0 #fff,
          61vw 13vh 0 0 #fff,
          69vw 5vh 0 0 #fff,
          77vw 11vh 0 0 #fff,
          85vw 7vh 0 0 #fff,
          93vw 14vh 0 0 #fff,
          6vw 22vh 0 0 #fff,
          97vw 25vh 0 0 #fff,
          4vw 38vh 0 0 #fff,
          14vw 45vh 0 0 #fff,
          23vw 33vh 0 0 #fff,
          33vw 48vh 0 0 #fff,
          50vw 40vh 0 0 #fff,
          58vw 35vh 0 0 #fff,
          67vw 50vh 0 0 #fff,
          75vw 42vh 0 0 #fff,
          83vw 36vh 0 0 #fff,
          91vw 48vh 0 0 #fff,
          11vw 53vh 0 0 #fff,
          46vw 52vh 0 0 #fff,
          8vw 65vh 0 0 #fff,
          20vw 72vh 0 0 #fff,
          35vw 60vh 0 0 #fff,
          55vw 68vh 0 0 #fff,
          63vw 78vh 0 0 #fff,
          72vw 62vh 0 0 #fff,
          80vw 75vh 0 0 #fff,
          90vw 66vh 0 0 #fff;
        animation: twinkle 2.4s ease-in-out infinite alternate;
      }

      @keyframes twinkle {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 1;
        }
      }

      .sparkle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #fff;
        box-shadow:
          0 -4px 0 #fff,
          0 4px 0 #fff,
          -4px 0 0 #fff,
          4px 0 0 #fff;
        animation: twinkle 1.8s ease-in-out infinite alternate;
      }

      .cloud {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #fff;
        box-shadow:
          4px 0 0 #fff,
          8px 0 0 #fff,
          12px 0 0 #fff,
          -8px 4px 0 #fff,
          -4px 4px 0 #fff,
          0 4px 0 #fff,
          4px 4px 0 #fff,
          8px 4px 0 #fff,
          12px 4px 0 #fff,
          16px 4px 0 #fff,
          20px 4px 0 #fff,
          -8px 8px 0 #dcecfb,
          -4px 8px 0 #dcecfb,
          0 8px 0 #dcecfb,
          4px 8px 0 #dcecfb,
          8px 8px 0 #dcecfb,
          12px 8px 0 #dcecfb,
          16px 8px 0 #dcecfb,
          20px 8px 0 #dcecfb;
      }

      .moon {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #fff;
        box-shadow:
          6px 0 0 #fff,
          12px 0 0 #fff,
          -6px 6px 0 #fff,
          0 6px 0 #fff,
          6px 6px 0 #fff,
          12px 6px 0 #fff,
          18px 6px 0 #fff,
          24px 6px 0 #fff,
          -12px 12px 0 #fff,
          -6px 12px 0 #fff,
          0 12px 0 #fff,
          6px 12px 0 #fff,
          12px 12px 0 #fff,
          18px 12px 0 #e4d9f2,
          24px 12px 0 #fff,
          30px 12px 0 #fff,
          -12px 18px 0 #fff,
          -6px 18px 0 #fff,
          0 18px 0 #fff,
          6px 18px 0 #fff,
          12px 18px 0 #e4d9f2,
          18px 18px 0 #fff,
          24px 18px 0 #fff,
          30px 18px 0 #fff,
          -12px 24px 0 #fff,
          -6px 24px 0 #fff,
          0 24px 0 #fff,
          6px 24px 0 #fff,
          12px 24px 0 #fff,
          18px 24px 0 #fff,
          24px 24px 0 #e4d9f2,
          30px 24px 0 #fff,
          -12px 30px 0 #fff,
          -6px 30px 0 #fff,
          0 30px 0 #e4d9f2,
          6px 30px 0 #fff,
          12px 30px 0 #fff,
          18px 30px 0 #fff,
          24px 30px 0 #fff,
          30px 30px 0 #fff,
          -6px 36px 0 #fff,
          0 36px 0 #fff,
          6px 36px 0 #fff,
          12px 36px 0 #fff,
          18px 36px 0 #fff,
          24px 36px 0 #fff,
          0 42px 0 #fff,
          6px 42px 0 #fff,
          12px 42px 0 #fff,
          18px 42px 0 #fff;
      }

      #welcome-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      #welcome-title {
        margin: 0;
        font-family: monogram, monospace;
        font-weight: bold;
        font-size: 7.5rem;
        letter-spacing: 0.3rem;
        color: #ebe1f7;
        text-shadow:
          1px 1px 0 #2d1b4d,
          2px 2px 0 #2d1b4d,
          3px 3px 0 #2d1b4d,
          4px 4px 0 #2d1b4d,
          5px 5px 0 #2d1b4d,
          6px 6px 0 #2d1b4d,
          7px 7px 0 #2d1b4d,
          8px 8px 0 #2d1b4d,
          9px 9px 0 #2d1b4d,
          10px 10px 0 #1f1438;
        user-select: none;
      }

      #welcome-controls {
        margin: 0;
        font-family: monogram, monospace;
        font-size: 2.2rem;
        color: #fff;
        text-shadow: 2px 2px 0 #2d1b4d;
        user-select: none;
      }

      #welcome-subtitle {
        margin: 0;
        font-family: monogram, monospace;
        font-size: 2.2rem;
        color: #fff;
        text-shadow: 2px 2px 0 #2d1b4d;
        animation: blink 1.2s steps(2, start) infinite;
        user-select: none;
      }

      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="room-a intro-active">
      <div>
        <div id="textbox-container" style="display: none">
          <div id="textbox">
            <span class="corner-ornament tl"></span>
            <span class="corner-ornament tr"></span>
            <span class="corner-ornament bl"></span>
            <span class="corner-ornament br"></span>
            <p id="dialogue" class="ui-text"></p>
            <div class="btn-container">
              <button id="close" class="ui-close-btn" aria-label="Close">&rarr;</button>
            </div>
          </div>
        </div>
      </div>
      <canvas id="game"></canvas>
      <p id="explore-status" style="display: none">You have explored 0% about me</p>
      <audio id="bgm" src="/bgm.mp3" loop preload="auto"></audio>
      <button id="music-toggle" aria-label="Toggle music" aria-pressed="true">🔊</button>
      <button id="skip-intro" aria-label="Skip introduction">Skip (Esc) &rarr;</button>
      <div id="welcome-screen">
        <div id="welcome-bg">
          <div class="stars"></div>
          <div class="sparkle" style="top: 10vh; left: 15vw"></div>
          <div class="sparkle" style="top: 8vh; left: 85vw"></div>
          <div class="sparkle" style="top: 45vh; left: 90vw"></div>
          <div class="sparkle" style="top: 50vh; left: 5vw"></div>
          <div class="sparkle" style="top: 70vh; left: 80vw"></div>
          <div class="moon" style="top: 5vh; left: 6vw; transform: scale(1.6)"></div>
          <div class="cloud" style="top: 6vh; left: 70vw; transform: scale(1.3)"></div>
          <div class="cloud" style="top: 18vh; left: 90vw; transform: scale(0.8)"></div>
          <div class="cloud" style="top: 42vh; left: 2vw; transform: scale(1.2)"></div>
          <div class="cloud" style="top: 30vh; left: 27vw; transform: scale(0.8)"></div>
          <div class="cloud" style="top: 52vh; left: 85vw; transform: scale(1.1)"></div>
          <div class="cloud" style="top: 68vh; left: 4vw; transform: scale(0.8)"></div>
          <div class="cloud" style="top: 72vh; left: 88vw; transform: scale(1.2)"></div>
          <div class="cloud" style="top: 14vh; left: 38vw; transform: scale(2.4)"></div>
          <div class="cloud" style="top: 72vh; left: 70vw; transform: scale(2.8)"></div>
          <div class="cloud" style="top: 78vh; left: 20vw; transform: scale(2.2)"></div>
          <div class="cloud" style="top: 10vh; left: 55vw; transform: scale(2)"></div>
        </div>
        <div id="welcome-content">
          <h1 id="welcome-title">CHIRAG'S PORTFOLIO</h1>
          <p id="welcome-controls">WASD or Arrow Keys to move</p>
          <p id="welcome-subtitle">Press any key or click to start</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
